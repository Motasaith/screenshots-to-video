    <!--
      One family, one variable axis, `display=swap`.

      This used to be an `@import` at the top of index.css, which is the worst
      place for it: the browser cannot even discover the font request until it
      has downloaded and parsed the stylesheet, so the two round trips run one
      after the other. As a <link> in <head> the font and the stylesheet are
      fetched in parallel, and the preconnects mean the TLS handshake to the
      font host is already done when the request goes out.

      It also used to pull four families (Inter, Lora, Caveat, JetBrains Mono)
      at eight weights. Three of those were barely used; mono is now the local
      system stack, which costs nothing.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400..700&display=swap"
    />
