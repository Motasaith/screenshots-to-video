# ──────────────────────────────────────────────────────────────
#  AI Video Studio — Docker Compose
#  Single service: the app (frontend + API + render worker)
#
#  The database is your existing remote/cloud MySQL — just set
#  DATABASE_URL in .env.docker and the app connects to it directly.
# ──────────────────────────────────────────────────────────────

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        # Passed to Vite at build time — inlined into the client bundle
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: 3000
    volumes:
      # Persist Kokoro TTS model cache (~80 MB) across restarts
      - kokoro_cache:/root/.cache/huggingface

volumes:
  kokoro_cache: